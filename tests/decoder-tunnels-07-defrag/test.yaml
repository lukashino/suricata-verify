requires:
  min-version: 9

args:
  - --set decoder.vxlan.enabled=true

checks:
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tunnel_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 2
        tunnel_id: 3
  - filter:
      count: 1
      match:
        event_type: flow
        proto: UDP
        src_ip: 10.5.5.4
        tunnel_id: 2
  - filter:
      count: 1
      match:
        event_type: flow
        proto: UDP
        src_ip: 10.5.5.4
        tunnel_id: 3
