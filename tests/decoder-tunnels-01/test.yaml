requires:
  min-version: 9

args:
  - --set decoder.vxlan.enabled=true

checks:
  - filter:
      count: 1
      match:
        event_type: flow
        proto: "ICMP"
        tunnel_id: 1
  - filter:
      count: 1
      match:
        event_type: flow
        proto: "ICMP"
        tunnel_id: 2
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tunnel_id: 1
        tunnel.tunnel_id: 1
        tunnel.proto: GRE
        tunnel.src_ip: 192.168.1.4
  - filter:
      count: 1
      match:
        event_type: alert
        alert.signature_id: 1
        tunnel_id: 2
        tunnel.tunnel_id: 2
        tunnel.proto: UDP
        tunnel.src_ip: 192.168.1.3
  - filter:
      count: 1
      match:
        event_type: flow
        proto: UDP
        src_ip: 192.168.1.3
        not-has-key: tunnel_id
