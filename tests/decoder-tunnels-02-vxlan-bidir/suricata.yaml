%YAML 1.1
---

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - flow

decoder:
  tunnels:
    - id: 2
      type: vxlan
      src: 192.168.1.3
      dst: 192.168.1.2
      session: 123
