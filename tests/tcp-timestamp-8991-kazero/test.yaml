# Ticket 8991 regression guard: a zero-length keep-alive is out of window at
# the endpoint, which does not advance TS.Recent from it, so the engine must
# not advance the stream timestamp from it either. Otherwise a later
# legitimate request with a lower timestamp that the endpoint still accepts
# would be wrongly rejected. No invalid-timestamp event must fire and the
# request must be inspected.
requires:
  min-version: 9

args:
  - -k none

checks:
  - filter:
      count: 0
      match:
        event_type: alert
        alert.signature_id: 9100002
  - filter:
      count: 1
      match:
        event_type: http
        http.url: "/malicious-xxx"
