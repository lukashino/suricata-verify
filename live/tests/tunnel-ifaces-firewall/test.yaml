environment: inline

requires:
  command:
    - jq
    - ping

args:
  - --af-packet
  - --runmode workers

client: |
  # plain ICMP is not part of a defined tunnel; the firewall must still
  # evaluate it and block it, so ping must fail
  if ip netns exec client0 ping -c 5 -i 0.2 -W 1 10.200.0.1; then
    echo "error: ping should have failed"
    exit 1
  fi

checks:
  - stats:
      capture.kernel_packets.__gt: 0
      # all 5 echo requests hit the default drop policy, ARP is accepted
      firewall.blocked: 5
