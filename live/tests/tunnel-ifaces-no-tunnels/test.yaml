environment: tap

requires:
  command:
    - jq
    - ping

args:
  - --af-packet=br0
  - --runmode workers

client: |
  ip netns exec client0 ping -c 3 -i 0.2 -W 1 10.200.0.1

checks:
  - stats:
      capture.kernel_packets.__gt: 0
  - shell:
      args: |
        n=$(jq -c 'select(.event_type == "alert" and .alert.signature_id == 1)' eve.json | wc -l)
        echo "alerts: ${n}"
        test "${n}" -ge 1
