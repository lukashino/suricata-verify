%YAML 1.1
---

default-rule-path: ${TESTDIR}
rule-files:
  - icmp.rules

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - stats:
            totals: yes
            threads: no
            interval: 1

decoder:
  tunnel-ifaces:
    - br0
