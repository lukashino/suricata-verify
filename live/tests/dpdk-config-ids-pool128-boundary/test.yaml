# IDS: static mempool=128, the power-of-two boundary above 16 + 16 descriptors plus one 32-packet
# RX burst on Suricata 9 (1 thread); 8.0.x creates the same 127/1 pool, so the test is not version-gated
environment: tap
requires:
  features:
    - DPDK
  command:
    - python3
    - ping
    - jq
    - grep
  script:
    - python3 -c 'import os; assert len(os.sched_getaffinity(0)) >= 2'
args:
  - --dpdk
  - --runmode workers
  - -v
  - --include "${OUTDIR}/dpdk.yaml"
  - -S "${TESTDIR}/../dpdk-config/icmp.rules"
  - --set dpdk.interfaces.0.threads=1
  - --set dpdk.interfaces.0.mempool-size=128
  - --set dpdk.interfaces.0.mempool-cache-size=auto
before: python3 "${TESTDIR}/../dpdk-config/prepare.py" ids 1
client: ip netns exec client0 ping -c 3 -i 0.2 -W 2 10.200.0.1
checks:
  - shell:
      args: grep -F -- '1 packet mempools of size 127, cache size 1' suricata.log
  - stats:
      capture.packets.__gt: 0
  - shell:
      args: jq -e -s 'any(.[]; .event_type == "alert" and .alert.signature_id == 1)' eve.json
