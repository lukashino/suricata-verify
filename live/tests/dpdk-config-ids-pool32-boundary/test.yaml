# Port of qa/live/dpdk/dpdk-testsuite.sh: IDS: static mempool=32, power-of-two boundary (fail)
# Suricata 8.0.x still accepts a 32-packet mempool for 16 + 16 descriptors.
environment: tap
requires:
  min-version: 9
  features:
    - DPDK
  command:
    - python3
    - grep
  script:
    - python3 -c 'import os; assert len(os.sched_getaffinity(0)) >= 2'
args:
  - --dpdk
  - --runmode workers
  - -v
  - --include "${OUTDIR}/dpdk.yaml"
  - -S "${TESTDIR}/../dpdk-config/icmp.rules"
  - --set dpdk.interfaces.0.threads=1
  - --set dpdk.interfaces.0.mempool-size=32
before: python3 "${TESTDIR}/../dpdk-config/prepare.py" ids 1
exit-code: 1
checks:
  - shell:
      args: grep -F -- 'mempool size is likely too small' suricata.log
